<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoefsmid Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alice&family=Homemade+Apple&family=Rye&display=swap">
<style>
/* Werkplaats: links het werkblad (canvas), rechts het klantkaartje op kraftpapier.
   Kleuren en letters komen uit website-hoefsmid/css/stijl.css, zodat game en website bij elkaar horen.
   Bewust één (lichte) stijl, net als de website. */
:root {
  --grijs: #dddbd7;
  --papier: #f4f0e7;
  --kraft: #b48d64;
  --kraft-donker: #8a6644;
  --inkt: #2b2926;
  --inkt-zacht: #5d5750;
  --gloed: #d8641f;      /* heet ijzer */
  --goed: #4f7a3f;
  --fout: #a8432f;
  --werkbank: #2e241d;

  --kop: "Rye", "Rockwell", Georgia, serif;
  --hand: "Homemade Apple", "Segoe Script", cursive;
  --tekst: "Alice", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--grijs); color: var(--inkt); }
body {
  margin: 0;
  font-family: var(--tekst);
  font-size: 1.05rem;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 18px 32px;
}
.pagina { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; }
h1 { font-family: var(--kop); font-weight: 400; font-size: clamp(1.7rem, 4.5vw, 2.6rem); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.ondertitel { font-family: var(--hand); font-size: .95rem; color: var(--inkt-zacht); margin: 0; }
.dag { font-variant-numeric: tabular-nums; color: var(--inkt-zacht); }
.dag strong { color: var(--inkt); }

.werk { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .werk { grid-template-columns: minmax(0, 1fr); } }

.bank {
  background: var(--werkbank);
  border-radius: 6px;
  padding: 10px;
  box-shadow: 0 8px 22px rgba(40,30,20,.28);
  display: grid; gap: 10px;
  min-width: 0;
}
canvas {
  display: block; width: 100%; max-width: 100%; aspect-ratio: 900 / 520;
  border-radius: 3px; touch-action: none; cursor: crosshair; background: #3a2d24;
}
.balk { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; min-height: 46px; }
.melding { color: var(--papier); font-size: 1rem; min-width: 0; flex: 1 1 260px; transition: color .2s; }
.melding.goed { color: #b9dc9f; }
.melding.fout { color: #f0a58f; }
.knoppen { display: flex; gap: 8px; flex-wrap: wrap; }

button {
  font: inherit; font-family: var(--kop); font-size: 1rem; letter-spacing: .03em;
  padding: .5em 1.05em; border-radius: 4px; cursor: pointer;
  border: 2px solid var(--inkt); background: var(--papier); color: var(--inkt);
  box-shadow: 0 3px 0 var(--inkt); transition: transform .06s, box-shadow .06s;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button:active, button.ingedrukt { transform: translateY(3px); box-shadow: 0 0 0 var(--inkt); }
button:focus-visible { outline: 2px dashed var(--papier); outline-offset: 3px; }
button.heet { background: var(--gloed); color: #fff8ee; }
button[disabled] { opacity: .45; cursor: not-allowed; }

aside { display: grid; gap: 16px; min-width: 0; }
.kaart {
  position: relative; background: var(--papier); padding: 18px 18px 16px;
  box-shadow: 0 6px 16px rgba(40,30,20,.18); transform: rotate(-.6deg);
}
.kaart.kraft { background: var(--kraft); color: #2a1f15; transform: rotate(.5deg); }
.tape {
  position: absolute; width: 38%; height: 22px; left: 31%; top: -11px; opacity: .92;
  background:
    repeating-linear-gradient(90deg, rgba(150,104,64,.35) 0 6px, transparent 6px 12px),
    repeating-linear-gradient(0deg, rgba(150,104,64,.35) 0 6px, transparent 6px 12px), #e8d3bb;
}
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--inkt-zacht); margin: 0 0 2px; }
.kraft .label { color: #4a3523; }
.paard-naam { font-family: var(--kop); font-size: 1.6rem; margin: 0; line-height: 1.15; }
.paard-ras { font-family: var(--hand); font-size: .85rem; margin: 4px 0 8px; }
.paard-tekst { margin: 0 0 12px; font-size: .97rem; }
.geduld { display: grid; gap: 4px; }
.geduld-rij { display: flex; justify-content: space-between; font-size: .9rem; }
.meter { height: 12px; background: rgba(43,41,38,.15); border-radius: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; background: var(--goed); transition: width .2s, background .3s; }

ol.stappen { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: stap; }
ol.stappen li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; counter-increment: stap; color: var(--inkt-zacht); }
ol.stappen li::before {
  content: counter(stap); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid currentColor; font-family: var(--kop); font-size: .95rem;
}
ol.stappen li.nu { color: var(--inkt); font-weight: 700; }
ol.stappen li.nu::before { background: var(--gloed); border-color: var(--gloed); color: #fff8ee; }
ol.stappen li.klaar { color: var(--inkt); }
ol.stappen li.klaar::before { background: var(--inkt); color: var(--papier); border-color: var(--inkt); }
.sterren { font-size: 1rem; letter-spacing: .1em; color: var(--kraft-donker); font-variant-numeric: tabular-nums; }

.uitleg { margin: 0; font-size: .95rem; }
.uitleg strong { font-weight: 700; }
.vakterm { font-family: var(--hand); font-size: .82rem; display: block; margin-top: 8px; color: #3a2a1c; }

@media (prefers-reduced-motion: reduce) { button { transition: none; } .meter i { transition: none; } }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <div>
      <h1>Hoefsmid Simulator</h1>
      <p class="ondertitel">Bekappen, smeden en beslaan, paard voor paard</p>
    </div>
    <div class="dag" id="dag">Vandaag: <strong id="dagPaarden">0</strong> paarden · <strong id="dagGeld">€ 0</strong> verdiend</div>
  </header>

  <div class="werk">
    <section class="bank" aria-label="Werkplaats">
      <canvas id="spel" width="900" height="520" aria-label="Werkplaats van de hoefsmid"></canvas>
      <div class="balk">
        <div class="melding" id="melding" role="status" aria-live="polite"></div>
        <div class="knoppen" id="knoppen"></div>
      </div>
    </section>

    <aside>
      <div class="kaart">
        <span class="tape" aria-hidden="true"></span>
        <p class="label">Klant</p>
        <p class="paard-naam" id="paardNaam">Bliksem</p>
        <p class="paard-ras" id="paardRas">Volbloed, 6 jaar</p>
        <p class="paard-tekst" id="paardTekst">Nerveus renpaard.</p>
        <div class="geduld">
          <div class="geduld-rij"><span>Geduld</span><span id="geduldTekst">Rustig</span></div>
          <div class="meter"><i id="geduldMeter"></i></div>
        </div>
      </div>

      <div class="kaart kraft">
        <span class="tape" aria-hidden="true"></span>
        <p class="label">De klus</p>
        <ol class="stappen" id="stappen">
          <li data-stap="0"><span>Inspecteren</span><span class="sterren"></span></li>
          <li data-stap="1"><span>Bekappen</span><span class="sterren"></span></li>
          <li data-stap="2"><span>Smeden</span><span class="sterren"></span></li>
          <li data-stap="3"><span>Beslaan</span><span class="sterren"></span></li>
        </ol>
      </div>

      <div class="kaart">
        <span class="tape" aria-hidden="true"></span>
        <p class="label">Zo doe je het</p>
        <p class="uitleg" id="uitleg"></p>
      </div>
    </aside>
  </div>
</div>

<script>
// ── Basis ──────────────────────────────────────────────────────────────────────
const W = 900, H = 520;
const canvas = document.getElementById('spel');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

function schaal() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
schaal();
window.addEventListener('resize', schaal);

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const kies = arr => arr[Math.floor(Math.random() * arr.length)];
const schud = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);

// ── Geluid (start pas na de eerste klik) ───────────────────────────────────────
let audio = null;
function geluid() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = false; } }
  if (audio && audio.state === 'suspended') audio.resume();
  return audio || null;
}
function tink(toon = 1) {
  const a = geluid(); if (!a) return;
  const t = a.currentTime;
  [1760 * toon, 2640 * toon, 4100 * toon].forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.18 / (i + 1), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35 + i * 0.1);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.6);
  });
}
function plof() {
  const a = geluid(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.15);
  g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.25);
}
function sis(duur = 0.8) {
  const a = geluid(); if (!a) return;
  const n = a.sampleRate * duur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = 3000; g.gain.value = 0.12;
  s.connect(f).connect(g).connect(a.destination); s.start();
}

// ── Deeltjes (rook, vonken, hoornkrullen) ──────────────────────────────────────
const deeltjes = [];
function strooi(x, y, kleur, aantal, snelheid = 2, zwaarte = 0.05, leven = 700, r = 3) {
  for (let i = 0; i < aantal; i++) {
    const h = Math.random() * Math.PI * 2, s = (0.4 + Math.random()) * snelheid;
    deeltjes.push({ x, y, vx: Math.cos(h) * s, vy: Math.sin(h) * s, kleur, zwaarte, leven: leven * rnd(.6, 1), max: leven, r: r * rnd(.6, 1.3) });
  }
}
function rook(x, y, aantal = 14) {
  for (let i = 0; i < aantal; i++)
    deeltjes.push({ x: x + rnd(-20, 20), y, vx: rnd(-.4, .4), vy: rnd(-1.6, -.7), kleur: 'rgba(230,226,218,.55)', zwaarte: -0.004, leven: rnd(900, 1600), max: 1600, r: rnd(8, 16), groei: true });
}
function updateDeeltjes(dt) {
  for (let i = deeltjes.length - 1; i >= 0; i--) {
    const p = deeltjes[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.zwaarte; p.vx *= .97;
    if (p.groei) p.r += .12;
    p.leven -= dt;
    if (p.leven <= 0) deeltjes.splice(i, 1);
  }
}
function tekenDeeltjes() {
  for (const p of deeltjes) {
    ctx.globalAlpha = clamp(p.leven / p.max, 0, 1);
    ctx.fillStyle = p.kleur;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ── Paarden ────────────────────────────────────────────────────────────────────
const PAARDEN = [
  { naam: 'Bliksem',   ras: 'Volbloed, 6 jaar',          tekst: 'Nerveus renpaard. Schrikt van elk geluid, dus werk vlot.',       drain: 1.7, hoorn: '#4a3b30', eigenaar: 'Mevrouw De Vries' },
  { naam: 'Doerak',    ras: 'Shetlander, 11 jaar',       tekst: 'Klein maar brutaal. Probeert steeds je pet op te eten.',        drain: 1.3, hoorn: '#3d3530', eigenaar: 'De familie Jansen' },
  { naam: 'Oma Truus', ras: 'KWPN-merrie, 23 jaar',      tekst: 'Heeft alles al meegemaakt en valt bijna in slaap.',             drain: 0.6, hoorn: '#6a5a49', eigenaar: 'Manege De Hoefslag' },
  { naam: 'Bram',      ras: 'Belgisch trekpaard, 9 jaar', tekst: 'Een reus met enorme hoeven. Lief, maar leunt graag op je.',     drain: 1.0, hoorn: '#55463a', eigenaar: 'Boer Hendriks' },
  { naam: 'Sterre',    ras: 'Friese merrie, 4 jaar',     tekst: 'Jong en nieuwsgierig. Voor het eerst bij de hoefsmid.',          drain: 1.4, hoorn: '#2f2a27', eigenaar: 'Lotte van Dijk' },
];

// ── Spelstatus ─────────────────────────────────────────────────────────────────
const STAP_NAMEN = ['Inspecteren', 'Bekappen', 'Smeden', 'Beslaan'];
const spel = { scherm: 'start', paard: null, stap: 0, scores: [], geduld: 100, schud: 0, vorigPaard: null };
let dag = { paarden: 0, geld: 0 };
try { const d = JSON.parse(localStorage.getItem('hoefsmid-dag') || 'null'); if (d) dag = d; } catch (e) {}
function bewaarDag() { try { localStorage.setItem('hoefsmid-dag', JSON.stringify(dag)); } catch (e) {} }
function toonDag() { $('dagPaarden').textContent = dag.paarden; $('dagGeld').textContent = '€ ' + dag.geld; }
toonDag();

function sterren(score) { return score >= 85 ? 3 : score >= 60 ? 2 : score >= 30 ? 1 : 0; }
function sterTekst(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }

let meldingTimer = 0;
function meld(tekst, soort = '') {
  const m = $('melding');
  m.textContent = tekst; m.className = 'melding ' + soort;
  meldingTimer = 2600;
}
function zetUitleg(html) { $('uitleg').innerHTML = html; }

function knoppen(lijst) {
  const k = $('knoppen'); k.innerHTML = '';
  for (const b of lijst) {
    const el = document.createElement('button');
    el.type = 'button'; el.id = b.id; el.textContent = b.tekst;
    if (b.heet) el.classList.add('heet');
    if (b.uit) el.disabled = true;
    if (b.klik) el.addEventListener('click', b.klik);
    if (b.vast) { // ingedrukt houden
      const aan = e => { e.preventDefault(); geluid(); b.vast(true); el.classList.add('ingedrukt'); };
      const uit = () => { b.vast(false); el.classList.remove('ingedrukt'); };
      el.addEventListener('pointerdown', aan);
      el.addEventListener('pointerup', uit); el.addEventListener('pointerleave', uit); el.addEventListener('pointercancel', uit);
    }
    k.appendChild(el);
  }
}

function geduldStraf(n) { spel.geduld = clamp(spel.geduld - n, 0, 100); }
function toonGeduld() {
  const g = spel.geduld;
  $('geduldMeter').style.width = g + '%';
  $('geduldMeter').style.background = g > 60 ? 'var(--goed)' : g > 30 ? '#c49a2a' : 'var(--fout)';
  $('geduldTekst').textContent = g > 60 ? 'Rustig' : g > 30 ? 'Wordt onrustig' : g > 0 ? 'Stampt en trekt' : 'Op!';
}
function toonStappen() {
  document.querySelectorAll('#stappen li').forEach((li, i) => {
    li.classList.toggle('nu', spel.scherm === 'werk' && i === spel.stap);
    li.classList.toggle('klaar', spel.scores[i] !== undefined);
    li.querySelector('.sterren').textContent = spel.scores[i] !== undefined ? sterTekst(sterren(spel.scores[i])) : '';
  });
}

// ── Hoef (onderkant) ───────────────────────────────────────────────────────────
// t = 0 is de teen (boven), t = ±π de hakken (onder). s = 1 is de buitenkant van de wand.
const HOEF = { x: 450, y: 262, r: 170 };
function hoefPunt(t, s) {
  return { x: HOEF.x + s * HOEF.r * 0.9 * Math.sin(t), y: HOEF.y - s * HOEF.r * 1.0 * Math.cos(t) + (Math.cos(t) < 0 ? -Math.cos(t) * 10 * s : 0) };
}
function hoefVorm(s, van = -Math.PI, tot = Math.PI) {
  ctx.beginPath();
  for (let i = 0; i <= 80; i++) {
    const p = hoefPunt(van + (tot - van) * i / 80, s);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
}
function tekenSchootsvel() {
  // leren schootsvel van de smid als ondergrond
  const g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 560);
  g.addColorStop(0, '#8a5a35'); g.addColorStop(1, '#4a2e1b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,230,200,.18)'; ctx.setLineDash([6, 7]); ctx.lineWidth = 2;
  ctx.strokeRect(22, 22, W - 44, H - 44); ctx.setLineDash([]);
}
function tekenHoefOnderkant(opties = {}) {
  const hoorn = spel.paard ? spel.paard.hoorn : '#4a3b30';
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  hoefVorm(1); ctx.closePath(); ctx.fillStyle = hoorn; ctx.fill();
  ctx.restore();
  // witte lijn
  hoefVorm(0.9); ctx.closePath(); ctx.fillStyle = '#e4d6b4'; ctx.fill();
  // zool
  hoefVorm(0.86); ctx.closePath();
  const z = ctx.createRadialGradient(HOEF.x, HOEF.y, 10, HOEF.x, HOEF.y, HOEF.r);
  z.addColorStop(0, '#cbb894'); z.addColorStop(1, '#a8916e');
  ctx.fillStyle = z; ctx.fill();
  // steunsels (bars)
  ctx.strokeStyle = '#8b7558'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  for (const k of [-1, 1]) {
    const a = hoefPunt(k * 2.75, 0.86);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(HOEF.x + k * 48, HOEF.y + 60); ctx.stroke();
  }
  // straal
  ctx.beginPath();
  ctx.moveTo(HOEF.x, HOEF.y - 0.22 * HOEF.r);
  ctx.quadraticCurveTo(HOEF.x + 70, HOEF.y + 90, HOEF.x + 58, HOEF.y + 0.98 * HOEF.r);
  ctx.lineTo(HOEF.x - 58, HOEF.y + 0.98 * HOEF.r);
  ctx.quadraticCurveTo(HOEF.x - 70, HOEF.y + 90, HOEF.x, HOEF.y - 0.22 * HOEF.r);
  ctx.fillStyle = '#7d6a55'; ctx.fill();
  ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(HOEF.x, HOEF.y + 30); ctx.lineTo(HOEF.x, HOEF.y + 0.95 * HOEF.r); ctx.stroke();
  if (opties.labels) {
    ctx.font = '15px Alice, Georgia, serif'; ctx.fillStyle = 'rgba(255,240,220,.85)'; ctx.textAlign = 'left';
    const lbl = (t, x, y, tx, ty) => { ctx.fillText(t, x, y); ctx.strokeStyle = 'rgba(255,240,220,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 4, y - 5); ctx.lineTo(tx, ty); ctx.stroke(); };
    const w = hoefPunt(-1.2, 0.97), wl = hoefPunt(-0.7, 0.88);
    lbl('hoornwand', 80, 140, w.x, w.y);
    lbl('witte lijn', 120, 90, wl.x, wl.y);
    lbl('straal', 660, 470, HOEF.x + 40, HOEF.y + 120);
  }
}

// ── Stap 1: Inspecteren ────────────────────────────────────────────────────────
const PROBLEMEN = [
  { id: 'steen', naam: 'Steentje in de zool', plek: () => ({ x: HOEF.x - 78, y: HOEF.y + 70 }),
    teken(p) { ctx.fillStyle = '#7b7d80'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 11, 8, .4, 0, 7); ctx.fill(); ctx.fillStyle = '#a3a6aa'; ctx.beginPath(); ctx.ellipse(p.x - 3, p.y - 2, 4, 3, .4, 0, 7); ctx.fill(); } },
  { id: 'scheur', naam: 'Scheurtje in de wand', plek: () => hoefPunt(1.05, 0.95),
    teken(p) { ctx.strokeStyle = '#1d1712'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(p.x - 8, p.y - 6); ctx.lineTo(p.x - 1, p.y); ctx.lineTo(p.x - 5, p.y + 6); ctx.lineTo(p.x + 3, p.y + 12); ctx.stroke(); } },
  { id: 'straalrot', naam: 'Straalrot (zwart en stinkend)', plek: () => ({ x: HOEF.x + 4, y: HOEF.y + 128 }),
    teken(p) { ctx.fillStyle = 'rgba(25,20,15,.8)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 9, 16, 0, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(60,70,30,.6)'; ctx.beginPath(); ctx.arc(p.x + 5, p.y - 8, 4, 0, 7); ctx.fill(); } },
  { id: 'hoorn', naam: 'Losse hoorn op de zool', plek: () => ({ x: HOEF.x + 70, y: HOEF.y - 50 }),
    teken(p) { ctx.fillStyle = '#ddd0b2'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(p.x + (i % 2) * 10 - 5, p.y + i * 5 - 8, 9, 4, i * .7, 0, 7); ctx.fill(); } } },
  { id: 'teen', naam: 'Veel te lange teen', plek: () => hoefPunt(0, 1.03),
    teken(p) { ctx.fillStyle = spel.paard.hoorn; ctx.beginPath(); ctx.ellipse(p.x, p.y - 4, 46, 12, 0, Math.PI, 0); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x - 36, p.y - 6); ctx.lineTo(p.x + 36, p.y - 6); ctx.stroke(); } },
  { id: 'spijker', naam: 'Spijker ingetrapt!', plek: () => ({ x: HOEF.x - 40, y: HOEF.y - 70 }),
    teken(p) { ctx.fillStyle = '#9da1a6'; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 7); ctx.fill(); ctx.strokeStyle = '#5a5e63'; ctx.lineWidth = 1.5; ctx.stroke(); } },
];
const inspectie = {
  start() {
    this.lijst = schud(PROBLEMEN).slice(0, 3).map(p => ({ ...p, pos: p.plek(), gevonden: false }));
    this.tijd = 25000; this.mis = 0; this.klaar = false; this.kringen = [];
    zetUitleg('Kijk goed naar de onderkant van de hoef. Er zijn <strong>3 dingen</strong> niet in orde. Klik ze aan voordat de tijd op is. Mis je, dan wordt het paard ongeduldig.<span class="vakterm">De witte lijn is de grens tussen wand en zool. Daar komen straks de nagels.</span>');
    knoppen([]);
    meld('Zoek de 3 problemen in de hoef.');
  },
  update(dt) {
    if (this.klaar) return;
    this.tijd -= dt;
    if (this.tijd <= 0) { this.tijd = 0; this.afronden(); }
  },
  klik(x, y) {
    if (this.klaar) return;
    const raak = this.lijst.find(p => !p.gevonden && Math.hypot(p.pos.x - x, p.pos.y - y) < 38);
    if (raak) {
      raak.gevonden = true; tink(1.5);
      meld('Gevonden: ' + raak.naam.toLowerCase() + '.', 'goed');
      if (this.lijst.every(p => p.gevonden)) this.afronden();
    } else {
      this.mis++; geduldStraf(4); plof();
      this.kringen.push({ x, y, t: 600 });
      meld('Daar is niets mis mee.', 'fout');
    }
  },
  afronden() {
    this.klaar = true;
    const gevonden = this.lijst.filter(p => p.gevonden).length;
    const score = clamp(Math.round(gevonden / 3 * 100 - this.mis * 6), 0, 100);
    meld(gevonden === 3 ? 'Alles gezien! Tijd om te bekappen.' : `Je vond ${gevonden} van de 3. De rest staat nu omcirkeld.`, gevonden === 3 ? 'goed' : 'fout');
    volgendeStap(score);
  },
  teken() {
    tekenSchootsvel();
    tekenHoefOnderkant({ labels: true });
    for (const p of this.lijst) p.teken(p.pos);
    for (const p of this.lijst) {
      if (!p.gevonden && !this.klaar) continue;
      ctx.strokeStyle = p.gevonden ? '#9fdc7f' : '#ff9b7d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.pos.x, p.pos.y, 30, 0, 7); ctx.stroke();
      ctx.font = '16px Alice, Georgia, serif'; ctx.textAlign = p.pos.x > HOEF.x ? 'left' : 'right';
      ctx.fillStyle = '#fff4e2';
      ctx.fillText(p.naam, p.pos.x + (p.pos.x > HOEF.x ? 38 : -38), p.pos.y + 5);
    }
    for (const k of this.kringen) {
      ctx.globalAlpha = k.t / 600; ctx.strokeStyle = '#ff9b7d'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(k.x - 10, k.y - 10); ctx.lineTo(k.x + 10, k.y + 10); ctx.moveTo(k.x + 10, k.y - 10); ctx.lineTo(k.x - 10, k.y + 10); ctx.stroke();
      ctx.globalAlpha = 1; k.t -= 16;
    }
    this.kringen = this.kringen.filter(k => k.t > 0);
    // klok
    const f = this.tijd / 25000;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(40, H - 46, 200, 14);
    ctx.fillStyle = f > .3 ? '#e6c88f' : '#ff9b7d'; ctx.fillRect(40, H - 46, 200 * f, 14);
    ctx.fillStyle = '#fff4e2'; ctx.font = '15px Alice, Georgia, serif'; ctx.textAlign = 'left';
    ctx.fillText(`Tijd: ${Math.ceil(this.tijd / 1000)} s`, 250, H - 34);
  },
};

// ── Stap 2: Bekappen ───────────────────────────────────────────────────────────
// Zijaanzicht: de draagrand is te lang en scheef. Raspen tot hij op de draaglijn ligt.
const BK = { links: 290, rechts: 590, basis: 360, n: 60, mm: 4 };
const bekappen = {
  start() {
    this.over = [];
    const ruis = rnd(0, 10);
    for (let i = 0; i < BK.n; i++) {
      const f = i / (BK.n - 1);                 // 0 = teen, 1 = hak
      this.over.push(10.5 - f * 6 + Math.sin(f * 7 + ruis) * 1.2 + rnd(-.3, .3));
    }
    this.teKort = new Set(); this.rasp = null; this.klaar = false; this.halen = 0;
    zetUitleg('Houd de muis (of je vinger) ingedrukt en <strong>beweeg heen en weer</strong> over de onderkant om te raspen. Breng de hoef tot op de gestippelde draaglijn. <strong>Begin bij de teen</strong>, daar is de wand het langst. Rasp je te ver, dan doet het het paard pijn.<span class="vakterm">Het waterpas laat zien of de hoef recht onder het been staat.</span>');
    knoppen([{ id: 'klaarKnop', tekst: 'Klaar met raspen', uit: true, klik: () => this.afronden() }]);
    meld('Rasp de te lange hoornwand weg.');
  },
  segmentX(i) { return BK.links + (BK.rechts - BK.links) * i / (BK.n - 1); },
  wandY(i) {
    // bovenkant hoef (kroonrand) loopt schuin: teen is lager getekend
    return BK.basis + this.over[i] * BK.mm;
  },
  omlaag(x, y) { this.rasp = { x, y }; },
  beweeg(x, y, ingedrukt) {
    if (!ingedrukt || this.klaar) { this.rasp = ingedrukt ? { x, y } : null; return; }
    const vorige = this.rasp || { x, y };
    const dx = Math.abs(x - vorige.x);
    this.rasp = { x, y };
    if (y < BK.basis - 70) return;
    for (let i = 0; i < BK.n; i++) {
      const sx = this.segmentX(i);
      const afstand = Math.abs(sx - x);
      if (afstand > 34) continue;
      const kracht = (1 - afstand / 34) * dx * 0.022;
      this.over[i] -= kracht;
      if (this.over[i] < -1.5 && !this.teKort.has(i)) {
        this.teKort.add(i); geduldStraf(2);
        meld('Au! Te ver geraspt, dat is gevoelig.', 'fout');
      }
      this.over[i] = Math.max(this.over[i], -3);
    }
    if (dx > 2) { this.halen += dx; if (Math.random() < .5) strooi(x, BK.basis + 6, '#d9c7a4', 1, 1.6, .15, 900, 2.5); }
    const max = Math.max(...this.over);
    const knop = $('klaarKnop'); if (knop) knop.disabled = max > 1.5;
    if (max <= 0.6 && !this.klaar) this.afronden();
  },
  afronden() {
    if (this.klaar) return;
    this.klaar = true; this.rasp = null;
    const max = Math.max(...this.over), min = Math.min(...this.over);
    const score = clamp(Math.round(100 - this.teKort.size * 3 - Math.max(0, max - min - 1.5) * 12), 0, 100);
    meld(this.teKort.size === 0 ? 'Mooi vlak bekapt. Op naar de oven!' : `Bekapt, maar op ${this.teKort.size} plekken te kort.`, this.teKort.size === 0 ? 'goed' : 'fout');
    volgendeStap(score);
  },
  teken() {
    // achtergrond: stal
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#5a4433'); g.addColorStop(1, '#2f241c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2;
    for (let y = 30; y < H; y += 46) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // been
    ctx.fillStyle = '#6b4a33';
    ctx.beginPath(); ctx.moveTo(400, 0); ctx.lineTo(500, 0); ctx.lineTo(520, 150); ctx.lineTo(380, 150); ctx.closePath(); ctx.fill();
    // kroonrand
    ctx.fillStyle = '#3a2a20'; ctx.fillRect(366, 146, 168, 16);
    // hoefwand met draagrand van segmenten
    ctx.beginPath();
    ctx.moveTo(370, 160); ctx.lineTo(530, 160);
    ctx.lineTo(BK.rechts, this.wandY(BK.n - 1));
    for (let i = BK.n - 1; i >= 0; i--) ctx.lineTo(this.segmentX(i), this.wandY(i));
    ctx.closePath();
    const hg = ctx.createLinearGradient(290, 0, 590, 0);
    hg.addColorStop(0, spel.paard.hoorn); hg.addColorStop(.5, '#7a6552'); hg.addColorStop(1, spel.paard.hoorn);
    ctx.fillStyle = hg; ctx.fill();
    // groeilijnen in de hoorn
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.5;
    for (let k = 1; k < 7; k++) { const y = 160 + k * 30; ctx.beginPath(); ctx.moveTo(370 - (y - 160) * .27, y); ctx.lineTo(530 + (y - 160) * .2, y); ctx.stroke(); }
    // te lange (oude) hoorn onder de draaglijn: lichter, zodat je ziet wat weg moet
    ctx.beginPath();
    ctx.moveTo(this.segmentX(0), BK.basis);
    for (let i = 0; i < BK.n; i++) ctx.lineTo(this.segmentX(i), Math.max(BK.basis, this.wandY(i)));
    ctx.lineTo(this.segmentX(BK.n - 1), BK.basis); ctx.closePath();
    ctx.fillStyle = '#c2a982'; ctx.fill();
    ctx.strokeStyle = 'rgba(90,70,50,.35)'; ctx.lineWidth = 1;
    for (let i = 0; i < BK.n; i += 3) { const y = this.wandY(i); if (y > BK.basis + 3) { ctx.beginPath(); ctx.moveTo(this.segmentX(i), BK.basis); ctx.lineTo(this.segmentX(i) + 2, y); ctx.stroke(); } }
    // te kort geraspte plekken
    for (const i of this.teKort) {
      ctx.fillStyle = 'rgba(200,60,50,.75)';
      ctx.fillRect(this.segmentX(i) - 3, this.wandY(i) - 6, 6, 6);
    }
    // draaglijn
    ctx.setLineDash([10, 8]); ctx.strokeStyle = '#f6e7c9'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(250, BK.basis); ctx.lineTo(630, BK.basis); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '15px Alice, Georgia, serif'; ctx.fillStyle = '#f6e7c9'; ctx.textAlign = 'left';
    ctx.fillText('draaglijn', 640, BK.basis + 5);
    ctx.textAlign = 'center'; ctx.fillText('teen', BK.links - 10, BK.basis + 70); ctx.fillText('hak', BK.rechts + 10, BK.basis + 70);
    // rasp
    if (this.rasp && !this.klaar) {
      const i = clamp(Math.round((this.rasp.x - BK.links) / (BK.rechts - BK.links) * (BK.n - 1)), 0, BK.n - 1);
      ctx.save(); ctx.translate(this.rasp.x, Math.max(this.wandY(i), BK.basis) + 8);
      ctx.fillStyle = '#9aa0a6'; ctx.fillRect(-70, -6, 140, 16);
      ctx.strokeStyle = '#5d6268'; ctx.lineWidth = 1;
      for (let x = -66; x < 70; x += 5) { ctx.beginPath(); ctx.moveTo(x, -6); ctx.lineTo(x + 4, 10); ctx.stroke(); }
      ctx.fillStyle = '#6d4a2c'; ctx.fillRect(70, -4, 40, 12);
      ctx.restore();
    }
    // waterpas + resterende lengte
    const derde = Math.floor(BK.n / 3);
    const gem = a => a.reduce((s, v) => s + v, 0) / a.length;
    const scheef = gem(this.over.slice(0, derde)) - gem(this.over.slice(-derde));
    const max = Math.max(...this.over);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(40, 30, 220, 92);
    ctx.fillStyle = '#f6e7c9'; ctx.textAlign = 'left'; ctx.font = '15px Alice, Georgia, serif';
    ctx.fillText('Waterpas', 54, 52);
    ctx.fillStyle = '#c9d77a'; ctx.fillRect(54, 62, 192, 20);
    ctx.strokeStyle = '#2b2926'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(140, 62); ctx.lineTo(140, 82); ctx.moveTo(160, 62); ctx.lineTo(160, 82); ctx.stroke();
    const bx = 150 + clamp(scheef * 9, -88, 88);
    ctx.fillStyle = 'rgba(255,255,240,.9)'; ctx.beginPath(); ctx.ellipse(bx, 72, 10, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f6e7c9';
    ctx.fillText(max > 0.6 ? `Nog ${max.toFixed(1).replace('.', ',')} mm te lang` : 'Op maat!', 54, 106);
  },
};

// ── Stap 3: Smeden ─────────────────────────────────────────────────────────────
const SLAGEN = 6;
const smeden = {
  start() {
    this.temp = 20; this.verhit = false; this.vorm = 0; this.kwaliteit = 100; this.fase = 0; this.hamer = 0;
    this.verbrand = false; this.klaar = false; this.scheef = 0;
    zetUitleg('Houd <strong>Verhitten</strong> ingedrukt tot het ijzer <strong>oranje-geel</strong> gloeit (900 tot 1.250 °C). Laat los en sla dan op het aambeeld als het wijzertje in het <strong>groene vak</strong> staat (klik, tik of spatiebalk). Na 6 goede slagen is het hoefijzer klaar. Wordt het ijzer te koud, warm het dan weer op.<span class="vakterm">Wit ijzer is verbrand. Dat wordt bros.</span>');
    knoppen([
      { id: 'verhitKnop', tekst: 'Verhitten (vasthouden)', heet: true, vast: aan => { this.verhit = aan && !this.klaar; } },
      { id: 'slaKnop', tekst: 'Slaan', klik: () => this.sla() },
    ]);
    meld('Leg het ijzer in de gasoven.');
  },
  kleur(t) {
    if (t < 480) return '#6f6f72';
    if (t < 700) return '#7d2a1d';
    if (t < 850) return '#b8311d';
    if (t < 1000) return '#e2571c';
    if (t < 1150) return '#f5902a';
    if (t < 1250) return '#ffd35a';
    return '#fff6d8';
  },
  kleurNaam(t) {
    if (t < 480) return 'koud';
    if (t < 700) return 'donkerrood';
    if (t < 850) return 'kersrood';
    if (t < 1000) return 'oranje';
    if (t < 1150) return 'oranje-geel';
    if (t < 1250) return 'geel';
    return 'wit: verbrand!';
  },
  update(dt) {
    if (this.klaar) return;
    const s = dt / 1000;
    if (this.verhit) {
      this.temp = Math.min(1450, this.temp + 330 * s);
      if (this.temp > 1250) {
        if (!this.verbrand) { this.verbrand = true; this.kwaliteit -= 12; meld('Te heet! Het ijzer verbrandt.', 'fout'); }
        if (Math.random() < .5) strooi(165, 300, '#fff1b0', 2, 4, .12, 500, 2);
      }
    } else {
      this.temp = Math.max(20, this.temp - 48 * s);
      if (this.temp < 1250) this.verbrand = false;
    }
    this.fase += s * (2.1 + this.vorm * 0.25);
    this.hamer = Math.max(0, this.hamer - dt);
  },
  wijzer() { return (Math.sin(this.fase) + 1) / 2; },  // 0..1
  sla() {
    if (this.klaar || this.verhit) return;
    geluid();
    this.hamer = 180;
    const w = this.wijzer(), afw = Math.abs(w - 0.5);
    if (this.temp < 800) {
      plof(); this.kwaliteit -= 4; geduldStraf(2);
      meld('Te koud! Koud ijzer kun je niet vormen. Eerst weer verhitten.', 'fout');
      return;
    }
    tink(1 - afw * .4);
    strooi(620, 330, '#ffcf6b', 10, 4.5, .18, 450, 2);
    if (afw < 0.09) { this.vorm += 1; meld('Pang! Mooie slag.', 'goed'); }
    else if (afw < 0.22) { this.vorm += 0.6; this.kwaliteit -= 3; meld('Redelijke slag.'); }
    else { this.vorm += 0.25; this.kwaliteit -= 7; this.scheef += (w > .5 ? 1 : -1) * 0.12; meld('Mis-slag, het ijzer trekt scheef.', 'fout'); }
    this.temp -= 25;
    if (this.vorm >= SLAGEN) this.afronden();
  },
  afronden() {
    this.klaar = true; this.vorm = SLAGEN; this.verhit = false;
    const score = clamp(Math.round(this.kwaliteit), 0, 100);
    meld('Het hoefijzer heeft zijn vorm. Nu passen en vastnagelen!', 'goed');
    volgendeStap(score);
  },
  tekenIJzer(cx, cy, buig, kleur, schaal = 1) {
    // staaf die tot een U buigt
    const lengte = 300 * schaal, n = 40, d = lengte / n;
    const helft = s => {
      const pts = [{ x: 0, y: 0 }]; let h = 0, x = 0, y = 0;
      for (let i = 1; i <= n / 2; i++) {
        h += buig * 0.095 * (1 + this.scheef * s);
        x += Math.cos(h) * d * s; y += Math.sin(h) * d;
        pts.push({ x, y });
      }
      return pts;
    };
    const l = helft(-1).reverse(), r = helft(1);
    const alle = l.concat(r.slice(1));
    const minY = Math.min(...alle.map(p => p.y)), maxY = Math.max(...alle.map(p => p.y));
    const dy = -(minY + maxY) / 2;
    ctx.save(); ctx.translate(cx, cy + dy);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = kleur; ctx.shadowBlur = this.temp > 700 ? 18 : 0;
    ctx.strokeStyle = kleur; ctx.lineWidth = 20 * schaal;
    ctx.beginPath(); alle.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    ctx.restore();
  },
  teken() {
    // smidse
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2a201a'); g.addColorStop(1, '#16110d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // gasoven
    ctx.fillStyle = '#4a4c50'; ctx.fillRect(60, 220, 210, 170);
    ctx.fillStyle = '#2c2d30'; ctx.fillRect(60, 380, 210, 14);
    const gloed = this.verhit ? 1 : .35;
    const og = ctx.createRadialGradient(165, 300, 5, 165, 300, 70);
    og.addColorStop(0, `rgba(255,${180 + 40 * gloed},80,${.9 * gloed})`); og.addColorStop(1, 'rgba(120,30,10,.9)');
    ctx.fillStyle = og; ctx.fillRect(95, 262, 140, 78);
    ctx.fillStyle = '#f6e7c9'; ctx.font = '15px Alice, Georgia, serif'; ctx.textAlign = 'center';
    ctx.fillText('gasoven', 165, 420);
    // aambeeld
    ctx.fillStyle = '#3d4044';
    ctx.beginPath(); ctx.moveTo(470, 345); ctx.lineTo(800, 345); ctx.lineTo(800, 370); ctx.lineTo(735, 380); ctx.lineTo(710, 440);
    ctx.lineTo(760, 470); ctx.lineTo(520, 470); ctx.lineTo(570, 440); ctx.lineTo(550, 380); ctx.lineTo(470, 362);
    ctx.quadraticCurveTo(420, 352, 470, 345); ctx.fill();
    ctx.fillStyle = '#5b5f64'; ctx.fillRect(470, 340, 330, 8);
    ctx.fillStyle = '#f6e7c9'; ctx.fillText('aambeeld', 640, 495);
    // ijzer
    const kleur = this.kleur(this.temp);
    if (this.verhit) this.tekenIJzer(165, 300, this.vorm / SLAGEN * 0.5 + .02, kleur, .38);
    else this.tekenIJzer(635, 300, this.vorm / SLAGEN, kleur, .7);
    // hamer
    const zwaai = this.hamer > 0 ? 0.1 : -0.55;
    ctx.save(); ctx.translate(740, 210); ctx.rotate(zwaai);
    ctx.fillStyle = '#7a5130'; ctx.fillRect(0, -6, 150, 12);
    ctx.fillStyle = '#55595e'; ctx.fillRect(-36, -26, 44, 52);
    ctx.restore();
    // thermometer
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(40, 30, 260, 120);
    const steps = [[20, '#6f6f72'], [480, '#7d2a1d'], [700, '#b8311d'], [850, '#e2571c'], [1000, '#f5902a'], [1150, '#ffd35a'], [1250, '#fff6d8']];
    const tx = t => 54 + (t / 1450) * 232;
    steps.forEach(([t, c], i) => { const nx = i < steps.length - 1 ? steps[i + 1][0] : 1450; ctx.fillStyle = c; ctx.fillRect(tx(t), 62, tx(nx) - tx(t), 18); });
    ctx.strokeStyle = '#9fdc7f'; ctx.lineWidth = 2; ctx.strokeRect(tx(900), 59, tx(1250) - tx(900), 24);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(tx(this.temp), 86); ctx.lineTo(tx(this.temp) - 7, 98); ctx.lineTo(tx(this.temp) + 7, 98); ctx.fill();
    ctx.fillStyle = '#f6e7c9'; ctx.textAlign = 'left';
    ctx.fillText('Temperatuur', 54, 52);
    ctx.fillText(`${Math.round(this.temp).toLocaleString('nl-NL')} °C · ${this.kleurNaam(this.temp)}`, 54, 120);
    ctx.fillText(`Vorm: ${Math.min(SLAGEN, Math.floor(this.vorm))} / ${SLAGEN} slagen`, 54, 140);
    // slagmeter
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(560, 30, 300, 80);
    ctx.fillStyle = '#f6e7c9'; ctx.fillText('Slagkracht', 574, 52);
    ctx.fillStyle = '#a8432f'; ctx.fillRect(574, 62, 272, 22);
    ctx.fillStyle = '#c49a2a'; ctx.fillRect(574 + 272 * .28, 62, 272 * .44, 22);
    ctx.fillStyle = '#4f7a3f'; ctx.fillRect(574 + 272 * .41, 62, 272 * .18, 22);
    const wx = 574 + 272 * this.wijzer();
    ctx.fillStyle = '#fff'; ctx.fillRect(wx - 2, 56, 4, 34);
    if (this.temp < 800 && !this.verhit && !this.klaar) {
      ctx.fillStyle = '#ff9b7d'; ctx.fillText('te koud om te slaan', 574, 104);
    }
  },
};

// ── Stap 4: Beslaan ────────────────────────────────────────────────────────────
// 4 nagels aan de buitenkant, 3 aan de binnenkant, allemaal in de witte lijn.
const NAGELS = [0.5, 0.9, 1.3, 1.7, -0.6, -1.05, -1.5];
const beslaan = {
  start() {
    this.nr = 0; this.fase = rnd(0, 6); this.kwaliteit = 100; this.gezet = []; this.klaar = false;
    this.passen = 1400;
    sis(1.2); rook(HOEF.x, HOEF.y - HOEF.r, 30);
    zetUitleg('Eerst wordt het hete ijzer even tegen de hoef gehouden om te passen. Daarna sla je de <strong>7 nagels</strong> in: 4 aan de buitenkant, 3 aan de binnenkant. Klik (of spatiebalk) als de naald in het <strong>groene vak</strong> staat. Te steil naar binnen raakt <strong>het leven</strong>, en dat doet pijn!<span class="vakterm">De nagel moet schuin naar buiten, zodat hij netjes uit de wand komt.</span>');
    knoppen([{ id: 'nagelKnop', tekst: 'Nagel inslaan', klik: () => this.nagel() }]);
    meld('Sssss... het ijzer is gepast en afgekoeld in de emmer.');
  },
  update(dt) {
    if (this.klaar) return;
    this.passen = Math.max(0, this.passen - dt);
    this.fase += dt / 1000 * (2.3 + this.nr * 0.3);
  },
  hoek() { return Math.sin(this.fase) * 60; },  // -60 (naar binnen) .. 60 (naar buiten)
  nagel() {
    if (this.klaar || this.passen > 0) return;
    geluid();
    const h = this.hoek();
    let uitkomst;
    if (h < -28) { uitkomst = 'leven'; this.kwaliteit -= 16; geduldStraf(18); spel.schud = 450; plof(); meld('AU! Je raakte het leven. ' + spel.paard.naam + ' trapt van schrik.', 'fout'); }
    else if (h > 30) { uitkomst = 'buiten'; this.kwaliteit -= 7; tink(.8); meld('Te ver naar buiten: de nagel komt te laag uit de wand.', 'fout'); }
    else if (Math.abs(h - 4) <= 11) { uitkomst = 'goed'; tink(1.2); meld('Perfect geplaatst.', 'goed'); }
    else { uitkomst = 'redelijk'; this.kwaliteit -= 3; tink(1); meld('Kan ermee door.'); }
    this.gezet.push(uitkomst);
    const p = hoefPunt(NAGELS[this.nr], 0.92);
    strooi(p.x, p.y, '#e6e6e6', 6, 2.5, .1, 350, 1.8);
    this.nr++;
    if (this.nr >= NAGELS.length) this.afronden();
  },
  afronden() {
    this.klaar = true;
    const score = clamp(Math.round(this.kwaliteit), 0, 100);
    meld('Nagels afgeknipt, omgeslagen en de rand gladgeraspt. Klaar!', 'goed');
    volgendeStap(score);
  },
  teken() {
    tekenSchootsvel();
    tekenHoefOnderkant();
    // hoefijzer volgt de wand
    const kleur = this.passen > 0 ? smeden.kleur(1000 * this.passen / 1400 + 200) : '#8c9196';
    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 32;
    hoefVorm(0.93, -2.6, 2.6); ctx.stroke();
    ctx.strokeStyle = kleur; ctx.lineWidth = 28; hoefVorm(0.93, -2.6, 2.6); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 4; hoefVorm(0.96, -2.55, 2.55); ctx.stroke();
    // nagelgaten en koppen
    NAGELS.forEach((t, i) => {
      const p = hoefPunt(t, 0.92);
      if (i < this.gezet.length) {
        const u = this.gezet[i];
        ctx.fillStyle = u === 'goed' ? '#d9dde1' : u === 'redelijk' ? '#c9c0a0' : u === 'buiten' ? '#d9a66b' : '#e0614d';
        ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 7); ctx.fill();
        ctx.strokeStyle = '#3a3d40'; ctx.lineWidth = 1.5; ctx.stroke();
      } else {
        ctx.fillStyle = '#2a2c2e'; ctx.fillRect(p.x - 3, p.y - 5, 6, 10);
        if (i === this.nr && !this.klaar && this.passen <= 0) {
          ctx.strokeStyle = '#ffd35a'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(p.x, p.y, 15 + Math.sin(performance.now() / 150) * 2, 0, 7); ctx.stroke();
        }
      }
    });
    ctx.font = '15px Alice, Georgia, serif'; ctx.fillStyle = '#fff4e2'; ctx.textAlign = 'center';
    ctx.fillText('binnenkant', 140, HOEF.y + 6); ctx.fillText('buitenkant', 760, HOEF.y + 6);
    // hoekmeter
    if (!this.klaar) {
      const gx = 760, gy = 450, r = 80;
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(gx - 120, gy - 118, 240, 140);
      const boog = (van, tot, kleur) => { ctx.strokeStyle = kleur; ctx.lineWidth = 18; ctx.lineCap = 'butt'; ctx.beginPath(); ctx.arc(gx, gy, r, (-90 + van) * Math.PI / 180, (-90 + tot) * Math.PI / 180); ctx.stroke(); };
      boog(-60, -28, '#a8432f'); boog(-28, -7, '#c49a2a'); boog(-7, 15, '#4f7a3f'); boog(15, 30, '#c49a2a'); boog(30, 60, '#b87a3a');
      const a = (this.hoek() - 90) * Math.PI / 180;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.cos(a) * (r + 12), gy + Math.sin(a) * (r + 12)); ctx.stroke();
      ctx.fillStyle = '#f6e7c9'; ctx.font = '13px Alice, Georgia, serif';
      ctx.textAlign = 'left'; ctx.fillText('leven', gx - 112, gy + 14);
      ctx.textAlign = 'right'; ctx.fillText('wand', gx + 112, gy + 14);
      ctx.textAlign = 'center'; ctx.fillText(`Nagel ${Math.min(this.nr + 1, 7)} van 7`, gx, gy - 100);
    }
  },
};

// ── Begin- en eindscherm ───────────────────────────────────────────────────────
const STAPPEN = [inspectie, bekappen, smeden, beslaan];
function huidig() { return spel.scherm === 'werk' ? STAPPEN[spel.stap] : null; }

let wachtOpVolgende = false;
function volgendeStap(score) {
  spel.scores[spel.stap] = score;
  toonStappen();
  wachtOpVolgende = true;
  const laatste = spel.stap === STAPPEN.length - 1;
  knoppen([{ id: 'verderKnop', tekst: laatste ? 'Bekijk de rekening' : 'Verder: ' + STAP_NAMEN[spel.stap + 1].toLowerCase(), heet: true, klik: () => {
    wachtOpVolgende = false;
    if (laatste) eindScherm();
    else { spel.stap++; toonStappen(); STAPPEN[spel.stap].start(); }
  } }]);
}

function nieuwPaard() {
  let p; do { p = kies(PAARDEN); } while (PAARDEN.length > 1 && p === spel.vorigPaard);
  spel.paard = p; spel.vorigPaard = p;
  spel.stap = 0; spel.scores = []; spel.geduld = 100; spel.scherm = 'werk'; wachtOpVolgende = false;
  $('paardNaam').textContent = p.naam; $('paardRas').textContent = p.ras; $('paardTekst').textContent = p.tekst;
  toonGeduld(); toonStappen();
  inspectie.start();
}

let rekening = null;
function eindScherm() {
  spel.scherm = 'eind';
  const gem = spel.scores.reduce((a, b) => a + b, 0) / spel.scores.length;
  const tarief = Math.round(120 * (0.6 + 0.4 * gem / 100));
  const fooi = Math.round(spel.geduld / 100 * gem / 100 * 15);
  const st = sterren(gem);
  const reacties = [
    'Hmm. Ik bel volgende keer toch maar een andere hoefsmid.',
    'Het loopt wel, maar mooi is anders.',
    'Netjes gedaan, tot over zes weken!',
    'Prachtig! Zo recht heeft het nog nooit gestaan.',
  ];
  rekening = { gem, tarief, fooi, st, tekst: reacties[st], eigenaar: spel.paard.eigenaar };
  dag.paarden += 1; dag.geld += tarief + fooi; bewaarDag(); toonDag();
  toonStappen();
  zetUitleg('Een paard moet ongeveer <strong>elke 6 tot 8 weken</strong> bij de hoefsmid langs. Beslaan met vier ijzers kost in het echt zo’n <strong>€ 100 tot € 150</strong>.<span class="vakterm">Lees meer op de website Informatie Hoefsmid.</span>');
  knoppen([{ id: 'volgendKnop', tekst: 'Volgend paard', heet: true, klik: nieuwPaard }]);
  meld(st >= 2 ? `${spel.paard.naam} loopt tevreden de stal uit.` : `${spel.paard.naam} loopt een beetje mopperend weg.`, st >= 2 ? 'goed' : '');
}

function tekenStart() {
  const g = ctx.createRadialGradient(W / 2, H * .7, 40, W / 2, H * .6, 600);
  g.addColorStop(0, '#6a3a1c'); g.addColorStop(.5, '#2e1f15'); g.addColorStop(1, '#16100c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // groot hoefijzer
  const t = performance.now() / 1000;
  const temp = 1050 + Math.sin(t * 1.4) * 120;
  smeden.temp = temp; smeden.scheef = 0;
  smeden.tekenIJzer(W / 2, 250, 1, smeden.kleur(temp), 1.1);
  if (Math.random() < .25) strooi(W / 2 + rnd(-120, 120), 330, '#ffcf6b', 1, 2.5, .08, 900, 2);
  ctx.textAlign = 'center'; ctx.fillStyle = '#f6e7c9';
  ctx.font = '44px Rye, Rockwell, Georgia, serif';
  ctx.fillText('Hoefsmid Simulator', W / 2, 90);
  ctx.font = '18px Alice, Georgia, serif';
  ctx.fillText('Inspecteren · Bekappen · Smeden · Beslaan', W / 2, 124);
  ctx.fillText('Er staat een paard voor je klaar in de stal.', W / 2, 460);
}

function tekenEind() {
  tekenSchootsvel();
  // bonnetje
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-.02);
  ctx.fillStyle = '#f4f0e7'; ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 20;
  ctx.fillRect(-210, -225, 420, 450); ctx.shadowBlur = 0;
  ctx.fillStyle = '#2b2926'; ctx.textAlign = 'center';
  ctx.font = '26px Rye, Rockwell, Georgia, serif'; ctx.fillText('Rekening', 0, -180);
  ctx.font = '16px Alice, Georgia, serif'; ctx.fillText(`${rekening.eigenaar} · ${spel.paard.naam}`, 0, -152);
  ctx.textAlign = 'left';
  STAP_NAMEN.forEach((n, i) => {
    const y = -112 + i * 30;
    ctx.fillText(n, -170, y);
    ctx.textAlign = 'right'; ctx.fillStyle = '#8a6644'; ctx.fillText(sterTekst(sterren(spel.scores[i])), 170, y);
    ctx.fillStyle = '#2b2926'; ctx.textAlign = 'left';
  });
  ctx.strokeStyle = '#2b2926'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(-170, 18); ctx.lineTo(170, 18); ctx.stroke(); ctx.setLineDash([]);
  const regel = (l, r, y, vet) => { ctx.font = (vet ? 'bold ' : '') + '17px Alice, Georgia, serif'; ctx.textAlign = 'left'; ctx.fillText(l, -170, y); ctx.textAlign = 'right'; ctx.fillText(r, 170, y); };
  regel('Bekappen en beslaan', '€ ' + rekening.tarief, 48);
  regel('Fooi', '€ ' + rekening.fooi, 74);
  regel('Totaal', '€ ' + (rekening.tarief + rekening.fooi), 106, true);
  ctx.textAlign = 'center'; ctx.font = '15px "Homemade Apple", "Segoe Script", cursive';
  wrap('"' + rekening.tekst + '"', 0, 152, 360, 26);
  ctx.restore();
}
function wrap(tekst, x, y, max, regelh) {
  const woorden = tekst.split(' '); let lijn = '';
  for (const w of woorden) {
    const test = lijn ? lijn + ' ' + w : w;
    if (ctx.measureText(test).width > max && lijn) { ctx.fillText(lijn, x, y); lijn = w; y += regelh; }
    else lijn = test;
  }
  ctx.fillText(lijn, x, y);
}

// ── Invoer ─────────────────────────────────────────────────────────────────────
let ingedrukt = false;
function punt(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  geluid();
  const p = punt(e); ingedrukt = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (spel.scherm === 'start') { nieuwPaard(); return; }
  const s = huidig(); if (!s || wachtOpVolgende) return;
  if (s === inspectie) inspectie.klik(p.x, p.y);
  if (s === bekappen) bekappen.omlaag(p.x, p.y);
  if (s === smeden) {
    if (p.x < 300 && p.y > 200) { smeden.verhit = true; const k = $('verhitKnop'); if (k) k.classList.add('ingedrukt'); }
    else smeden.sla();
  }
  if (s === beslaan) beslaan.nagel();
});
canvas.addEventListener('pointermove', e => {
  const s = huidig();
  if (s === bekappen && !wachtOpVolgende) { const p = punt(e); bekappen.beweeg(p.x, p.y, ingedrukt); }
});
const loslaten = () => {
  ingedrukt = false;
  if (huidig() === smeden) { smeden.verhit = false; const k = $('verhitKnop'); if (k) k.classList.remove('ingedrukt'); }
  if (huidig() === bekappen) bekappen.rasp = null;
};
canvas.addEventListener('pointerup', loslaten);
canvas.addEventListener('pointercancel', loslaten);
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  const s = huidig();
  if (s === smeden || s === beslaan) { e.preventDefault(); if (!wachtOpVolgende) (s === smeden ? smeden.sla() : beslaan.nagel()); }
});

// ── Lus ────────────────────────────────────────────────────────────────────────
let vorige = performance.now();
function lus(nu) {
  const dt = Math.min(50, nu - vorige); vorige = nu;
  const s = huidig();
  if (s) {
    if (s.update) s.update(dt);
    if (!wachtOpVolgende) spel.geduld = clamp(spel.geduld - spel.paard.drain * dt / 1000 * 0.9, 0, 100);
    toonGeduld();
  }
  updateDeeltjes(dt);
  if (meldingTimer > 0) meldingTimer -= dt;

  ctx.save();
  if (spel.schud > 0) { spel.schud -= dt; ctx.translate(rnd(-8, 8), rnd(-6, 6)); }
  if (spel.scherm === 'start') tekenStart();
  else if (spel.scherm === 'eind') tekenEind();
  else s.teken();
  tekenDeeltjes();
  ctx.restore();
  requestAnimationFrame(lus);
}

zetUitleg('Jij bent de hoefsmid. Elk paard krijgt de volledige behandeling: eerst <strong>inspecteren</strong>, dan <strong>bekappen</strong>, een ijzer <strong>smeden</strong> en tot slot <strong>beslaan</strong>. Let op het geduld van het paard: hoe sneller en netter je werkt, hoe hoger de fooi.');
knoppen([{ id: 'startKnop', tekst: 'Begin de werkdag', heet: true, klik: nieuwPaard }]);
meld('Klik op Begin de werkdag.');
$('paardNaam').textContent = 'Nog geen paard'; $('paardRas').textContent = 'De stal is nog leeg';
$('paardTekst').textContent = 'Zodra je begint, komt het eerste paard binnen.';
toonStappen();
requestAnimationFrame(lus);
</script>
