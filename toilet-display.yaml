substitutions:
  device_name: toilet-display
  ha_entity_id: light.toilet          # <-- change to your actual HA entity ID

esphome:
  name: ${device_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Survives deep sleep — used to skip e-ink refresh when state hasn't changed
globals:
  - id: last_state
    type: std::string
    restore_value: true

deep_sleep:
  wakeup_pin: GPIO33               # connect light switch signal (3.3V) here
  wakeup_pin_mode: INVERT_WAKEUP   # wakes on both rising and falling edge
  run_duration: 10s                # shorter now: just connect + sync + maybe refresh
  sleep_duration: 300s             # fallback: re-sync every 5 min even without GPIO trigger

text_sensor:
  - platform: homeassistant
    id: toilet_state
    entity_id: ${ha_entity_id}
    on_value:
      then:
        - lambda: |-
            if (x == id(last_state)) return;
            id(last_state) = x;
            id(eink).update();

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 64
  - file: "gfonts://Roboto"
    id: font_label
    size: 18

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

display:
  - platform: waveshare_epaper
    id: eink
    cs_pin: GPIO5
    dc_pin: GPIO17
    busy_pin: GPIO4
    reset_pin: GPIO16
    model: 1.54in
    update_interval: never
    lambda: |-
      it.fill(COLOR_ON);
      std::string state = id(toilet_state).state;
      if (state == "on") {
        it.print(100, 85, id(font_large), COLOR_OFF, TextAlign::CENTER, "Bezet");
        it.print(100, 160, id(font_label), COLOR_OFF, TextAlign::CENTER, "WC bezet");
      } else {
        it.print(100, 85, id(font_large), COLOR_OFF, TextAlign::CENTER, "Vrij");
        it.print(100, 160, id(font_label), COLOR_OFF, TextAlign::CENTER, "WC vrij");
      }
