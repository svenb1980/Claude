{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ t.setup_title }}</h1>
  <p>{{ t.setup_intro }}</p>
  {% if legacy %}<p class="notice notice-ok">{{ t.setup_legacy }}</p>{% endif %}
  <p class="muted small">{{ t.setup_warning }}</p>
  {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/setup" class="stack">
    <label>{{ t.login_username }}<input type="text" name="username" autofocus required autocomplete="username"></label>
    <label>{{ t.acc_new_password }}<input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
    <button class="primary">{{ t.setup_button }}</button>
  </form>
</section>
{% endblock %}
