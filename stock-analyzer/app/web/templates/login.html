{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ t.login_title }}</h1>
  {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>{{ t.login_username }}<input type="text" name="username" autofocus required autocomplete="username"></label>
    <label>{{ t.login_password }}<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary">{{ t.login_button }}</button>
  </form>
</section>
{% endblock %}
