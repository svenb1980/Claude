{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ t.login_title }}</h1>
  {% if failed %}<p class="notice notice-error" role="alert">{{ t.login_failed }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>{{ t.login_password }}<input type="password" name="password" autofocus required autocomplete="current-password"></label>
    <button class="primary">{{ t.login_button }}</button>
  </form>
</section>
{% endblock %}
