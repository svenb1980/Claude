<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #69F0AE;
      margin-bottom: 6px;
    }

    p {
      font-size: 12px;
      color: #888;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    #checkBtn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1565C0;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.1s;
    }

    #checkBtn:hover  { background: #1976D2; }
    #checkBtn:active { transform: scale(0.97); }
    #checkBtn:disabled { background: #444; color: #777; cursor: default; }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
      min-height: 16px;
      text-align: center;
    }

    #status.error { color: #FF5252; }
    #status.ok    { color: #69F0AE; }

    #logSection {
      display: none;
      margin-top: 16px;
    }

    #logHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    #logLabel {
      font-size: 10px;
      font-weight: 700;
      color: #555;
      letter-spacing: 0.8px;
    }

    #clearLog {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 11px;
      padding: 0;
    }

    #clearLog:hover { color: #888; }

    #logOutput {
      width: 100%;
      height: 180px;
      background: #0a120a;
      color: #aaa;
      font: 11px/1.5 monospace;
      border: 1px solid #2a4a2a;
      border-radius: 4px;
      padding: 8px;
      resize: none;
      white-space: pre;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>📊 Hours Check</h1>
  <p>Checks last week's logged hours and opens the hours report.</p>
  <button id="checkBtn">📊 Check Hours</button>
  <div id="status"></div>

  <div id="logSection">
    <div id="logHeader">
      <span id="logLabel">LAST RUN LOG</span>
      <button id="clearLog">clear</button>
    </div>
    <textarea id="logOutput" readonly></textarea>
  </div>

  <script src="popup.js"></script>
</body>
</html>
