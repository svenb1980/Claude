<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Marktplaats Speurder</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 420px; }
    body.tab { width: auto; max-width: 760px; margin: 0 auto; padding: 16px; }

    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
    header img { width: 26px; height: 26px; }
    header h1 { font-size: 15px; margin: 0; flex: 1; }
    body.tab header { border: 1px solid var(--line); border-radius: var(--radius); }

    #status { padding: 8px 14px; font-size: 12px; color: var(--muted); }
    #status .err { color: var(--warn); display: block; margin-top: 2px; }

    #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
    .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { .chip.on { color: #0b1a20; } }

    #list { max-height: 440px; overflow-y: auto; padding: 0 10px 10px; }
    body.tab #list { max-height: none; }
    .item { display: flex; gap: 10px; padding: 9px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: inherit; }
    .item:hover { border-color: var(--accent); }
    .item.unread { border-left: 4px solid var(--accent); background: linear-gradient(90deg, var(--accent-soft), var(--card) 40%); }
    .thumb { width: 64px; height: 64px; flex: none; border-radius: 6px; object-fit: cover; background: var(--line); }
    .body { min-width: 0; flex: 1; }
    .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .price { font-weight: 700; color: var(--accent); }
    .meta { font-size: 12px; color: var(--muted); }

    .empty { text-align: center; padding: 28px 20px; color: var(--muted); }
    .empty p { margin: 0 0 12px; }

    footer { display: flex; justify-content: space-between; padding: 8px 14px 12px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>Marktplaats Speurder</h1>
    <button id="check" class="icon" title="Nu controleren">⟳</button>
    <button id="settings" class="icon" title="Zoekopdrachten en instellingen">⚙</button>
  </header>
  <div id="status"></div>
  <div id="chips"></div>
  <div id="list"></div>
  <footer>
    <button id="clear" class="link">Lijst leegmaken</button>
    <button id="openTab" class="link">Open in tabblad</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
