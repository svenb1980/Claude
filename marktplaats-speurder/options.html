<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Marktplaats Speurder – instellingen</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .top img { width: 40px; height: 40px; }
    .top h1 { margin: 0; font-size: 22px; }
    .top p { margin: 0; }

    section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
    section > h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    .watch { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
    .watch:first-of-type { border-top: none; }
    .watch.off .info { opacity: .55; }
    .watch .info { flex: 1; min-width: 0; }
    .watch .name { font-weight: 600; }
    .watch .actions { display: flex; gap: 6px; flex: none; }
    .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-top: 2px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .grid .full { grid-column: 1 / -1; }
    label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
    label.f .hint, .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; }
    .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-weight: 400; }
    .checks label, label.c { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; }

    dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(680px, calc(100vw - 32px)); background: var(--card); color: var(--text); }
    dialog::backdrop { background: rgba(10, 15, 20, .45); }
    dialog form { padding: 20px; }
    dialog h2 { margin: 0 0 14px; font-size: 18px; }
    .errors { color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; margin-top: 12px; font-size: 13px; }
    .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .buttons .left { margin-right: auto; }

    #preview { margin-top: 12px; font-size: 13px; }
    #preview ol { margin: 6px 0 0; padding-left: 20px; }
    #preview li { margin-bottom: 3px; }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
    #toast.show { opacity: 1; }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .watch { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<main>
  <div class="top">
    <img src="icons/icon128.png" alt="">
    <div>
      <h1>Marktplaats Speurder</h1>
      <p class="muted">Zoekopdrachten die op de achtergrond in de gaten worden gehouden.</p>
    </div>
  </div>

  <section>
    <h2>Zoekopdrachten <button id="add" class="primary">+ Nieuwe zoekopdracht</button></h2>
    <div id="watches"></div>
  </section>

  <section>
    <h2>Algemeen</h2>
    <div class="grid">
      <label class="f">Controleer elke
        <select id="intervalMin">
          <option value="1">minuut</option>
          <option value="2">2 minuten</option>
          <option value="5">5 minuten</option>
          <option value="10">10 minuten</option>
          <option value="15">15 minuten</option>
          <option value="30">30 minuten</option>
          <option value="60">uur</option>
        </select>
        <span class="hint">Alleen terwijl Chrome open is.</span>
      </label>
      <label class="f">Meldingen per zoekopdracht
        <select id="maxNotify">
          <option value="1">1 – daarna één samenvatting</option>
          <option value="3">3 – daarna één samenvatting</option>
          <option value="5">5 – daarna één samenvatting</option>
          <option value="10">10 – daarna één samenvatting</option>
        </select>
      </label>
      <label class="c full"><input type="checkbox" id="notify"> Bureaubladmelding bij nieuwe advertenties</label>
    </div>
  </section>

  <section>
    <h2>Back-up</h2>
    <p class="muted small" style="margin-top:0">Bewaar je zoekopdrachten als bestand, of zet ze over naar een andere computer.</p>
    <div class="row">
      <button id="export">Exporteren</button>
      <button id="import">Importeren…</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<dialog id="editor">
  <form method="dialog" id="form" novalidate>
    <h2 id="editorTitle">Nieuwe zoekopdracht</h2>
    <div class="grid">
      <label class="f full">Naam <span class="hint">Hoe de zoekopdracht in meldingen heet. Leeg = zoekterm.</span>
        <input id="name" placeholder="bijv. Bambu Lab printer">
      </label>
      <label class="f full">Zoekterm
        <input id="query" placeholder="bijv. bambu lab a1">
      </label>
      <label class="f">Categorie
        <select id="l1"><option value="">Alle categorieën</option></select>
      </label>
      <label class="f">Subcategorie
        <select id="l2" disabled><option value="">Alle subcategorieën</option></select>
      </label>
      <label class="f">Prijs (€)
        <span class="row"><input id="priceMin" inputmode="decimal" placeholder="van"> – <input id="priceMax" inputmode="decimal" placeholder="tot"></span>
      </label>
      <label class="f">Postcode en afstand
        <span class="row">
          <input id="postcode" placeholder="1234AB" maxlength="7" style="max-width:110px">
          <select id="distanceKm"><option value="">Alle afstanden</option></select>
        </span>
      </label>
      <div class="f full">Conditie <span class="hint">Niets aangevinkt = alles.</span>
        <div class="checks" id="conditions"></div>
      </div>
      <label class="f full">Uitsluiten <span class="hint">Woorden in de titel, gescheiden door komma's. Bijv.: gezocht, defect, onderdelen</span>
        <input id="exclude">
      </label>
      <label class="c full"><input type="checkbox" id="inDescription"> Ook zoeken in de beschrijving</label>
      <label class="c full"><input type="checkbox" id="skipAds"> Topadvertenties en dagtoppers overslaan</label>
      <label class="c full"><input type="checkbox" id="active"> Actief</label>
    </div>
    <div id="errors" class="errors" hidden></div>
    <div id="preview" hidden></div>
    <div class="buttons">
      <button type="button" id="test" class="left">Testen</button>
      <button type="button" id="cancel">Annuleren</button>
      <button type="submit" id="save" class="primary">Opslaan</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>
<script type="module" src="options.js"></script>
</body>
</html>
